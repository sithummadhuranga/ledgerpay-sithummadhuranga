name: deploy

# Every push to develop or main builds the api image and puts it in the GitHub container registry. The step that
# deploys it to Azure only runs when the repository variable AZURE_DEPLOY is true, so a push is never red because
# Azure is not set up. Nothing is published or deployed from any other branch, even when the run is started by hand.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    if: ${{ github.ref_name == 'develop' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the image name
        id: name
        # The registry wants lower case, and the owner name may have capitals.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ledgerpay-api" >> "$GITHUB_OUTPUT"
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the api image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: >
          docker build backend --target api
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -t "${IMAGE}:${GITHUB_SHA}"
          -t "${IMAGE}:${GITHUB_REF_NAME}"
      - name: Push the image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker push --all-tags "$IMAGE"

  azure:
    needs: image
    if: ${{ vars.AZURE_DEPLOY == 'true' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The publish profile is the deployment password of this one web app. It can deploy to that app and nothing else.
      # Resetting the publish profile in the portal makes a leaked copy useless.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.image.outputs.image }}:${{ github.sha }}
      - name: Wait for the api to answer its health check
        if: ${{ vars.API_URL != '' }}
        env:
          API_URL: ${{ vars.API_URL }}
        # A free database that was paused takes about a minute to wake, and the first calls fail until it does.
        run: |
          url="${API_URL%/}/api/v1/health"
          for attempt in $(seq 1 18); do
            if curl --silent --fail --max-time 5 "$url"; then echo; exit 0; fi
            echo "Not ready yet, attempt $attempt"; sleep 10
          done
          echo "The api did not answer its health check in about five minutes." >&2
          exit 1
