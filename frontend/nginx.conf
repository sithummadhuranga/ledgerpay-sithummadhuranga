server {
    listen 8080;
    server_name _;

    # The version of nginx is not told to anyone.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's own name server. The address of the api is looked up again every few seconds, so the api can be
    # replaced without restarting this container.
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    # The API, its description and its Swagger page are on the api container. The client address is overwritten, not
    # appended to, so a browser cannot make up the address the API sees.
    location ~ ^/(api/|swagger|openapi/) {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # File names under /assets carry a hash of their content, so a browser may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Any other address is a page of the app. The app reads the path and shows the right screen.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
