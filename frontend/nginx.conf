server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API, its description and its Swagger page are on the api container. The client address is overwritten, not
    # appended to, so a browser cannot make up the address the API sees.
    location ~ ^/(api/|swagger|openapi/) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # File names under /assets carry a hash of their content, so a browser may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Any other address is a page of the app. The app reads the path and shows the right screen.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
